[package]
name = "host-app"
version = "0.1.0"
edition = "2021"

[features]
vsock = ["dep:tokio-vsock"]

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
futures = "0.3"
bytes = "1"
tokio-vsock = { version = "0.5", optional = true }
