[package]
name = "enclave-app"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
nix = { version = "0.29", features = ["socket", "net"] }
aws-nitro-enclaves-nsm-api = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
alloy-primitives = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
