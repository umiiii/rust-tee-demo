[package]
name = "enclave-app"
version = "0.1.0"
edition = "2021"

[features]
vsock = ["dep:tokio-vsock", "dep:aws-nitro-enclaves-nsm-api", "dep:serde_bytes"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-vsock = { version = "0.5", optional = true }
tokio-tungstenite = "0.24"
aws-nitro-enclaves-nsm-api = { version = "0.4", optional = true }
serde_bytes = { version = "0.11", optional = true }
sha2 = "0.10"
hex = "0.4"
serde_json = "1.0"
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
base64 = "0.22"
axum = "0.8.8"
tower = "0.5"
futures = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
